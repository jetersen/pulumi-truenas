name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish-release:
        description: Existing release tag to publish to GitHub Packages (skip build)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: provider-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: inputs.publish-release == ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: |
            provider/go.sum
            provider/shim/go.sum
            sdk/go.sum
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@jetersen'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13'
      - uses: pulumi/actions@8582a9e8cc630786854029b4e09281acd6794b58 # v6
        with:
          pulumi-version: '3.268.0'
      - name: Install Python build tools
        run: python3 -m pip install build
      - name: Select release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'VERSION=0.1.0' >> "$GITHUB_ENV"
          fi
      - name: Generate, build, and test
        run: |
          make provider sdk test test-compose-preview VERSION=0.1.0
          git diff --exit-code -- provider/cmd/pulumi-resource-truenas sdk/go
          if [[ "$VERSION" != "0.1.0" ]]; then
            make test-compose-preview
          fi
          bash scripts/package.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: packages
          path: |
            dist/*.nupkg
            dist/*.tgz
            dist/*.whl
            dist/*.tar.gz
            dist/checksums.txt
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg dist/*.tgz dist/*.whl dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes "${release_flags[@]}"
          git tag "sdk/$GITHUB_REF_NAME"
          git push origin "sdk/$GITHUB_REF_NAME"
  publish:
    needs: build
    if: >-
      always() && !cancelled() &&
      ((needs.build.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish-release != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@jetersen'
      - name: Download and verify release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish-release || github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.nupkg' --pattern '*.tgz' --pattern checksums.txt
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
      - name: Publish NuGet to GitHub Packages
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/jetersen/index.json --name github
          dotnet nuget push 'dist/*.nupkg' --source github --skip-duplicate
      - name: Publish npm to GitHub Packages
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish-release || github.ref_name }}
        run: |
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          npm publish ./dist/*.tgz --registry https://npm.pkg.github.com --tag "$tag"
