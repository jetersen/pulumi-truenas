name: Build and release
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish-release:
        description: Existing release tag to publish to GitHub Packages (skip build)
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: provider-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: inputs.publish-release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-go-cache
        with:
          scope: provider
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@jetersen'
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: '3.268.0'
      - name: Select release version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo 'VERSION=0.1.0' >> "$GITHUB_ENV"
          fi
      - name: Generate, build, and test
        run: |
          make provider sdk test VERSION=0.1.0 SDK_LANGUAGES=go
          git diff --exit-code -- provider/cmd/pulumi-resource-truenas sdk/go
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            make provider sdk tools-yaml
          fi
      - name: Upload generated SDKs and schema
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: generated
          path: |
            sdk
            provider/cmd/pulumi-resource-truenas/schema.json
            provider/cmd/pulumi-resource-truenas/bridge-metadata.json
            !sdk/**/bin/**
            !sdk/**/obj/**
            !sdk/**/node_modules/**
          retention-days: 1
      - name: Upload CLI test binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -czf cli-tools.tar.gz -C bin pulumi-resource-truenas pulumi-language-dotnet pulumi-language-yaml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-tools
          path: cli-tools.tar.gz
          retention-days: 1
  cli-test:
    name: CLI tests (${{ matrix.scenario }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Separate runners isolate the C# SDK's bin/obj outputs.
        scenario: [yaml, yaml-overlay, dotnet, dotnet-overlay]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: generated
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: cli-tools
      - name: Restore CLI test binaries
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p bin
          tar -xzf cli-tools.tar.gz -C bin
          echo "$PWD/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/setup-go-cache
        with:
          scope: ${{ startsWith(matrix.scenario, 'dotnet') && 'provider-dotnet' || 'provider-yaml' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: startsWith(matrix.scenario, 'dotnet')
        with:
          dotnet-version: '10.0.x'
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        with:
          pulumi-version: '3.268.0'
      - name: Build CLI test inputs
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: |
          if [[ "$SCENARIO" == dotnet* ]]; then
            make provider sdk SDK_LANGUAGES=dotnet
          else
            make provider tools-yaml
          fi
      - name: Cache NuGet downloads
        if: startsWith(matrix.scenario, 'dotnet')
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-${{ runner.arch }}-dotnet-packages-v2-${{ hashFiles('sdk/dotnet/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-dotnet-packages-v2-
      - name: Test Compose CLI preview
        env:
          SCENARIO: ${{ matrix.scenario }}
          TRUENAS_COMPOSE_CLI_TEST: '1'
        run: |
          export PATH="$GITHUB_WORKSPACE/bin:$PATH"
          export VERSION=0.1.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          cd provider
          go test -count=1 -run "^TestComposeCLIPreview/$SCENARIO$" -v .
  sdk:
    name: SDK (${{ matrix.component }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        component: [dotnet, nodejs, python, go]
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: generated
      - uses: ./.github/actions/setup-go-cache
        if: ${{ !startsWith(github.ref, 'refs/tags/v') || matrix.component == 'go' }}
        with:
          scope: ${{ matrix.component == 'go' && 'sdk' || matrix.component == 'dotnet' && 'provider-dotnet' || 'provider' }}
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.component == 'dotnet'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.component == 'nodejs'
        with:
          node-version: '24'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        if: matrix.component == 'python'
        with:
          python-version: '3.15'
      - uses: pulumi/actions@8e5e406f4007fca908480587cb9893c07090f58d # v7
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          pulumi-version: '3.268.0'
      - name: Generate SDK for validation
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        env:
          COMPONENT: ${{ matrix.component }}
        run: make sdk SDK_LANGUAGES="$COMPONENT"
      - name: Cache package downloads
        if: matrix.component == 'dotnet' || matrix.component == 'nodejs' || matrix.component == 'python'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ matrix.component == 'dotnet' && '~/.nuget/packages' || matrix.component == 'nodejs' && '~/.npm' || '~/.cache/pip' }}
          key: ${{ runner.os }}-${{ runner.arch }}-${{ matrix.component }}-packages-v2-${{ matrix.component == 'dotnet' && hashFiles('sdk/dotnet/*.csproj') || hashFiles('sdk/nodejs/package.json', 'sdk/python/pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-${{ matrix.component }}-packages-v2-
      - name: Install Python build tools
        if: matrix.component == 'python' && startsWith(github.ref, 'refs/tags/v')
        run: python3 -m pip install build
      - name: Build and test SDK
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/build-sdk.sh "$COMPONENT"
      - name: Package release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          COMPONENT: ${{ matrix.component }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export VERSION="${GITHUB_REF_NAME#v}"
          fi
          bash scripts/package.sh "$COMPONENT" --no-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: packages-${{ matrix.component }}
          compression-level: 0
          path: |
            dist/*.nupkg
            dist/*.tgz
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
  provider-archives:
    name: Provider (${{ matrix.os }}/${{ matrix.arch }})
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: generated
      - uses: ./.github/actions/setup-go-cache
        with:
          scope: archives-${{ matrix.os }}-${{ matrix.arch }}
          # Native builds lack -trimpath and cannot warm release compilation.
          provider-fallback: 'false'
      - name: Build provider archive
        env:
          PROVIDER_OS: ${{ matrix.os }}
          PROVIDER_ARCH: ${{ matrix.arch }}
        run: |
          export VERSION="${GITHUB_REF_NAME#v}"
          bash scripts/package.sh provider
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: packages-provider-${{ matrix.os }}-${{ matrix.arch }}
          compression-level: 0
          path: dist/pulumi-resource-truenas-*.tar.gz
          if-no-files-found: error
  checks:
    name: Build and tests
    needs: [build, sdk, cli-test]
    if: always() && inputs.publish-release == ''
    runs-on: ubuntu-latest
    steps:
      - name: Require all build and test jobs
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  release:
    needs: [sdk, cli-test, provider-archives]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: packages-*
          merge-multiple: true
          path: dist
      - name: Checksum packages
        run: (cd dist && sha256sum ./*.nupkg ./*.tgz ./*.whl ./*.tar.gz > checksums.txt)
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease --latest=false)
          fi
          tar -xzf "dist/pulumi-truenas-go-${GITHUB_REF_NAME}.tar.gz" -C sdk
          git add sdk/go sdk/go.mod sdk/go.sum
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' \
              -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m "chore: generate Go SDK for $GITHUB_REF_NAME"
          fi
          git tag "sdk/$GITHUB_REF_NAME"
          git push origin "sdk/$GITHUB_REF_NAME"
          gh release create "$GITHUB_REF_NAME" dist/*.nupkg dist/*.tgz dist/*.whl dist/*.tar.gz dist/checksums.txt --verify-tag --generate-notes "${release_flags[@]}"
  publish:
    strategy:
      fail-fast: false
      matrix:
        component: [dotnet, nodejs]
    needs: release
    if: >-
      always() && !cancelled() &&
      ((needs.release.result == 'success' && startsWith(github.ref, 'refs/tags/v')) ||
       (github.event_name == 'workflow_dispatch' && inputs.publish-release != ''))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        if: matrix.component == 'dotnet'
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        if: matrix.component == 'nodejs'
        with:
          node-version: '24'
          registry-url: https://npm.pkg.github.com
          scope: '@jetersen'
      - name: Download and verify release packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish-release || github.ref_name }}
        run: |
          mkdir -p dist
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist --pattern '*.nupkg' --pattern '*.tgz' --pattern checksums.txt
          (cd dist && sha256sum --check --ignore-missing checksums.txt)
      - name: Publish NuGet to GitHub Packages
        if: matrix.component == 'dotnet'
        env:
          NuGetPackageSourceCredentials_github: Username=${{ github.actor }};Password=${{ github.token }};ValidAuthenticationTypes=Basic
        run: |
          dotnet nuget add source https://nuget.pkg.github.com/jetersen/index.json --name github
          dotnet nuget push 'dist/*.nupkg' --source github --skip-duplicate
      - name: Publish npm to GitHub Packages
        if: matrix.component == 'nodejs'
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.publish-release || github.ref_name }}
        run: |
          tag=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then tag=next; fi
          npm publish ./dist/*.tgz --registry https://npm.pkg.github.com --tag "$tag"
